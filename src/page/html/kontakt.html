<section class="wrap" id="kontakt" data-screen="me">
<div class="head"><h2>Kontakt</h2></div>
<div class="kgrid">
<form class="card kform" id="cform">
<label>Tema<select name="kind"><option value="poruka">Poruka</option><option value="ispravka">Ispravka podataka</option><option value="greska">Greška na sajtu</option></select></label>
<label>Poruka<textarea name="msg" rows="5" required minlength="3" maxlength="4000"></textarea></label>
<label><span>Imejl <span class="m">(nije obavezno)</span></span><input name="mail" type="email" maxlength="200" autocomplete="email"></label>
<label class="hp" aria-hidden="true">Sajt<input name="website" tabindex="-1" autocomplete="off"></label>
<div class="krow"><button class="b dark" type="submit">Pošalji</button><span class="m" id="cstat" aria-live="polite"></span></div>
</form>
