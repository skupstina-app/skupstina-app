<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Raspored sedenja · admin · skupština.app</title>
<style>
:root{--bg:#111211;--card:#1a1c1b;--ink:#ecebe6;--mute:rgba(236,235,230,.6);--line:rgba(255,255,255,.1);--seat:#2a2d2c;--live:#5fc2b6;
--p0:#e07a6e;--p1:#8fbd8a;--p2:#eba46c;--p3:#7fa6d1;--p4:#63ae9f;--p5:#cfb567;--p6:#aab3c2;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;margin:0;font-weight:600}
header .sp{flex:1}
.m{color:var(--mute);font-size:13px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:rgba(255,255,255,.3)}
#login{display:grid;place-items:center;gap:14px;padding:80px 16px;text-align:center}
#app{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;height:calc(100vh - 57px)}
@media(max-width:900px){#app{grid-template-columns:1fr;height:auto}#side{border-left:0;border-top:1px solid var(--line);max-height:none}}
#hallWrap{overflow:auto;padding:16px}
#hall,.pres{margin-inline:auto}
.pres{text-align:center;margin:0 auto 14px;padding:8px;border:1px dashed var(--line);border-radius:8px;max-width:520px;font-size:13px;color:var(--mute)}
#hall{display:flex;flex-direction:column;gap:6px;width:max-content;margin:0 auto}
.row{display:flex;justify-content:center;gap:10px}
.sec{display:flex;gap:2px}
.seat{width:var(--s,24px);height:var(--s,24px);border-radius:4px;background:var(--seat);border:2px solid transparent;position:relative;padding:0;flex:none;background-size:cover;background-position:center 20%}
.seat.taken{border-color:var(--c)}
.seat.sel{outline:2px solid var(--live);outline-offset:1px}
.seat.over{outline:2px dashed var(--live)}
.seat span{position:absolute;inset:auto 0 -1px 0;font-size:9px;line-height:11px;text-align:center;background:rgba(0,0,0,.6);border-radius:0 0 3px 3px;overflow:hidden;white-space:nowrap}
.rowlbl{font-size:11px;color:var(--mute);text-align:center;margin-top:-2px}
#side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.tools input[type=search]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:3px 9px;font-size:12px;border-radius:999px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
#list li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:grab;user-select:none}
#list li:hover{background:var(--card)}
#list li.sel{background:var(--card);outline:2px solid var(--live)}
#list .ph{width:28px;height:28px;border-radius:5px;background:var(--seat) center 20%/cover;flex:none;border-left:3px solid var(--c)}
#list .nm{flex:1;min-width:0}
#list .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .st{font-size:12px;color:var(--mute)}
#selbar{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;min-height:52px}
#status{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header><h1>Raspored sedenja</h1><span class="m" id="count"></span><span class="sp"></span><label class="m">Veličina <input type="range" id="zoom" min="12" max="36" step="1"></label><span id="status"></span><span class="m" id="who"></span><button id="out" hidden>Odjavi se</button></header>
<div id="login" hidden><p>Prijavi se Google nalogom administratora.</p><div id="gbtn"></div><p class="m" id="lerr"></p></div>
<div id="app" hidden>
 <div id="hallWrap"><div class="pres">Predsedništvo (predsednik i potpredsednici: mesta po funkciji) · pogled kao na prenosu</div><div id="hall"></div>
 <p class="m" style="text-align:center;margin-top:14px">Klikni poslanika u listi pa mesto, ili ga prevuci. Klik na zauzeto mesto pa na drugo menja ih. Promene se čuvaju same.</p></div>
 <div id="side">
  <div class="tools"><input type="search" id="q" placeholder="Traži poslanika"><div class="chips" id="chips"></div><label class="m"><input type="checkbox" id="only"> samo neraspoređeni</label></div>
  <ul id="list"></ul>
  <div id="selbar"><span class="m" id="seltxt">Ništa nije izabrano</span><span class="sp" style="flex:1"></span><button id="unseat" hidden>Skloni sa mesta</button></div>
 </div>
</div>
<script>
const CLIENT_ID="__CLIENT_ID__";
const $=s=>document.querySelector(s);
/* the hall as on the public Sala map: 8 sections, 6 rows; row 0 nearest the presidium; each row adds a seat per section */
const SEC=[5,3,3,3,3,3,3,5],ROWS=6;
const GROUPS=[["Studentska lista",/СТУДЕНТ/],["SVM",/МАЂАР|MAGYAR/],["Albanska koal.",/АЛБАН|SHQIP/],["Ljudski",/ЉАЈИЋ|ЉУДСКИ/],["SDA Sandžaka",/SDA|СДА|САНЏАК/],["Pokret za ujed.",/ПОКРЕТ ЗА УЈЕДИЊЕЊЕ|POKRET ZA UJEDINJENJE/],["Srbija pobeđuje",/УЈЕДИЊЕНА СРБИЈА|ВУЧИЋ/]];
const gOf=m=>{const x=(m.l||"").toUpperCase();const i=GROUPS.findIndex(g=>g[1].test(x));return i<0?6:i};
let MPS=[],sel=null,fg=-1;const bySeat=new Map();
const status=(t,ok=true)=>{const s=$("#status");s.textContent=t;s.style.color=ok?"":"#e07a6e"};
async function api(path,body){const r=await fetch(path,body?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}:{});return r.json()}
function index(){bySeat.clear();MPS.forEach(m=>{if(m.s)bySeat.set(m.s,m)})}
function drawHall(){
 let h="";for(let i=0;i<ROWS;i++){h+=`<div class="row">`;
  /* sections and seats right-to-left in the data, shown left-to-right like the broadcast */
  for(let k=SEC.length-1;k>=0;k--){h+=`<div class="sec">`;for(let j=SEC[k]+i-1;j>=0;j--){const key=`${i}-${k}-${j}`,m=bySeat.get(key);
   h+=`<button class="seat${m?" taken":""}${sel&&sel.s===key?" sel":""}" data-seat="${key}" title="${m?esc(m.n)+" · ":""}red ${i+1}, sektor ${8-k}" ${m?`draggable="true" style="--c:var(--p${gOf(m)});${m.ph?`background-image:url(/p/${m.id})`:""}"`:""}>${m&&!m.ph?`<span>${esc(ini(m.n))}</span>`:""}</button>`}h+=`</div>`}
  h+=`</div>`}
 $("#hall").innerHTML=h;
 const lead=MPS.filter(m=>m.r).length,placed=MPS.filter(m=>m.s&&!m.r).length;$("#count").textContent=`raspoređeno ${placed} / ${MPS.length-lead}`;
}
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const ini=n=>n.split(" ").map(w=>w[0]).join("").slice(0,3);
function drawList(){
 const q=$("#q").value.trim().toLowerCase(),only=$("#only").checked;
 const rows=MPS.filter(m=>!m.r&&(fg<0||gOf(m)===fg)&&(!only||!m.s)&&(!q||m.n.toLowerCase().includes(q)));
 $("#list").innerHTML=rows.map(m=>`<li draggable="true" data-id="${m.id}" class="${sel===m?"sel":""}" style="--c:var(--p${gOf(m)})"><span class="ph"${m.ph?` style="background-image:url(/p/${m.id})"`:""}></span><span class="nm"><b>${esc(m.n)}</b><span class="st">${GROUPS[gOf(m)][0]}${m.s?` · red ${+m.s.split("-")[0]+1}, sektor ${8-m.s.split("-")[1]}`:" · bez mesta"}</span></span></li>`).join("");
 $("#seltxt").textContent=sel?sel.n+(sel.s?" (na mestu)":" (bez mesta)"):"Ništa nije izabrano";$("#unseat").hidden=!(sel&&sel.s);
}
function draw(){index();drawHall();drawList()}
/* seat size: fit the 68-seat back row to the screen by default; the slider zooms */
const fit=()=>Math.max(12,Math.min(30,Math.floor(($("#hallWrap").clientWidth-32-70)/68)-2));
const setZoom=v=>{$("#hall").style.setProperty("--s",v+"px");$("#zoom").value=v;try{localStorage.setItem("sala-zoom",v)}catch(e){}};
$("#zoom").oninput=e=>setZoom(+e.target.value);
async function save(changes){status("Čuvam…");const j=await api("/admin/api/seats",{set:changes}).catch(()=>({ok:false}));status(j.ok?"Sačuvano":"Greška: nije sačuvano",j.ok);if(!j.ok)load()}
/* put m in seat key; whoever sat there goes to m's old seat (swap) or off the map */
function place(m,key){if(!m||m.r)return;const other=bySeat.get(key);if(other===m)return;const old=m.s||null;const ch=[{id:m.id,seat:key}];
 if(other){other.s=old;ch.push({id:other.id,seat:old})}m.s=key;sel=null;draw();save(ch)}
$("#hall").addEventListener("click",e=>{const b=e.target.closest("[data-seat]");if(!b)return;const key=b.dataset.seat,m=bySeat.get(key);
 if(sel){place(sel,key);return}if(m){sel=m;draw()}});
$("#list").addEventListener("click",e=>{const li=e.target.closest("[data-id]");if(!li)return;const m=MPS.find(x=>x.id==li.dataset.id);sel=sel===m?null:m;draw()});
$("#unseat").onclick=()=>{if(!sel||!sel.s)return;const m=sel;m.s=null;sel=null;draw();save([{id:m.id,seat:null}])};
/* drag and drop (mouse) */
document.addEventListener("dragstart",e=>{const li=e.target.closest("[data-id]"),st=e.target.closest("[data-seat]");const m=li?MPS.find(x=>x.id==li.dataset.id):st?bySeat.get(st.dataset.seat):null;if(m){e.dataTransfer.setData("text/plain",String(m.id));e.dataTransfer.effectAllowed="move"}});
$("#hall").addEventListener("dragover",e=>{const b=e.target.closest("[data-seat]");if(b){e.preventDefault();document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));b.classList.add("over")}});
$("#hall").addEventListener("drop",e=>{e.preventDefault();const b=e.target.closest("[data-seat]");const m=MPS.find(x=>x.id==e.dataTransfer.getData("text/plain"));if(b&&m)place(m,b.dataset.seat)});
$("#list").addEventListener("dragover",e=>e.preventDefault());
$("#list").addEventListener("drop",e=>{e.preventDefault();const m=MPS.find(x=>x.id==e.dataTransfer.getData("text/plain"));if(m&&m.s){m.s=null;draw();save([{id:m.id,seat:null}])}});
document.addEventListener("dragend",()=>document.querySelectorAll(".over").forEach(x=>x.classList.remove("over")));
$("#q").oninput=drawList;$("#only").onchange=drawList;
$("#chips").innerHTML=`<button data-g="-1" aria-pressed="true">Svi</button>`+GROUPS.map((g,i)=>`<button data-g="${i}" aria-pressed="false">${g[0]}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest("[data-g]");if(!b)return;fg=+b.dataset.g;document.querySelectorAll("#chips button").forEach(x=>x.setAttribute("aria-pressed",x===b));drawList()};
$("#out").onclick=async()=>{await api("/admin/api/logout",{});location.reload()};
async function load(){const j=await api("/admin/api/seats");if(!j.ok){showLogin();return}MPS=j.mps;draw();let z=null;try{z=+localStorage.getItem("sala-zoom")}catch(e){}setZoom(z||fit())}
function showLogin(){$("#app").hidden=true;$("#login").hidden=false;
 if(!CLIENT_ID){$("#lerr").textContent="Google prijava još nije podešena (nedostaje Client ID).";return}
 const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=()=>{google.accounts.id.initialize({client_id:CLIENT_ID,callback:async r=>{const j=await api("/admin/api/login",{credential:r.credential});if(j.ok)location.reload();else $("#lerr").textContent=j.err==="not_admin"?`${j.email} nije administrator.`:"Prijava nije uspela."}});google.accounts.id.renderButton($("#gbtn"),{theme:"filled_black",size:"large",text:"signin_with",locale:"sr"})};document.head.appendChild(s)}
(async()=>{const me=await api("/admin/api/me");if(!me.email){showLogin();return}$("#who").textContent=me.email;$("#out").hidden=false;$("#app").hidden=false;load()})();
</script>
</body>
</html>
